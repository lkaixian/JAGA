# docker compose up --build   ->  http://localhost:8088
# MASTER_URL must be the master's IP (containers can't resolve .local):  MASTER_URL=http://192.168.1.50 docker compose up
services:
  api:
    build: ./server
    environment:
      MASTER_URL: ${MASTER_URL:-http://192.168.1.50}
      SITE_NAME: ${SITE_NAME:-UTHM Parit Raja}
      SITE_LOGO: ${SITE_LOGO:-/uthm.png}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./downloads:/srv/downloads:ro  # drop jaga.apk here to offer it on the homepage
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  # Public HTTPS without opening ports:  TUNNEL_TOKEN=<token> docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - nginx
    restart: unless-stopped
