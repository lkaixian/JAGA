# One JAGA site: polls its own master node, keeps a local copy, and pushes to the hub.
# Outbound only: nothing here needs a public address, a tunnel or an open port.
#   1. copy .env.example to .env and fill it in
#   2. docker compose up -d
# The local dashboard at http://<this PC>:8088 keeps working even if the hub is down.
services:
  api:
    build: ../server
    environment:
      MASTER_URL: ${MASTER_URL:?set MASTER_URL in .env}
      SITE_NAME: ${SITE_NAME:?set SITE_NAME in .env}
      SITE_LOGO: ${SITE_LOGO:-/logo.png}
      HUB_URL: ${HUB_URL:?set HUB_URL in .env}
      SITE_SLUG: ${SITE_SLUG:?set SITE_SLUG in .env}
      SITE_TOKEN: ${SITE_TOKEN:?set SITE_TOKEN in .env}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"   # LAN only: do not forward this port on the router
    volumes:
      - ../dashboard:/usr/share/nginx/html:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
