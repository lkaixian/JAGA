# Requests arriving through the Cloudflare tunnel carry Cf-Connecting-Ip. Public visitors may read, never write.
map $http_cf_connecting_ip$request_method $tunnel_write {
    default 0;
    "~^.+(POST|PUT|PATCH|DELETE)$" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;  # behind the tunnel nginx can't know the public scheme or port: send relative redirects

    location / { try_files $uri $uri.html $uri/index.html /index.html; }

    # /dashboard is the server picker; /server/<slug> is one hub site's live dashboard.
    # A bare /<slug> redirects there, so the address bar always shows /server/<slug>.
    location ~ ^/(dashboard|classic)/?$ { try_files /$1.html =404; }
    location ~ "^/(?!(?:dashboard|classic|downloads|api|hub|server|servers|index)/?$)(?<slug>[a-z0-9][a-z0-9-]{1,38}[a-z0-9])/?$" {
        return 301 /server/$slug;
    }

    location @server_down {
        default_type application/json;
        return 503 '{"error":{"code":"server_down","message":"The server isn\'t answering."}}';
    }

    location /downloads/ { alias /srv/downloads/; }

    # The master (on another network) POSTs readings here through the tunnel; its bearer token guards it
    location = /api/ingest {
        resolver 127.0.0.11 valid=5s;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
    }

    location /api/ {
        default_type application/json;
        if ($tunnel_write) { return 403 '{"error":{"code":"read_only","message":"Changes can only be made from the local network."}}'; }
        resolver 127.0.0.11 valid=5s;  # Docker DNS: re-resolve so rebuilding api doesn't leave a stale IP
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # Hub (optional): per-site data under /server/<slug>/, site pushes under /hub/, directory at /servers.json
    location ~ ^/server/[a-z0-9-]+/?$ { try_files /site.html =404; }

    location /server/ {
        default_type application/json;
        if ($tunnel_write) { return 403 '{"error":{"code":"read_only","message":"Changes can only be made from the local network."}}'; }
        resolver 127.0.0.11 valid=5s;
        set $hub http://hub:8100;
        proxy_pass $hub;  # variable without a URI part: nginx sends the original request URI
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # No tunnel_write rule: sites POST here from the internet through the tunnel (their bearer token guards it)
    location /hub/ {
        resolver 127.0.0.11 valid=5s;
        set $hub http://hub:8100;
        proxy_pass $hub;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location = /servers.json {
        resolver 127.0.0.11 valid=5s;
        set $hub http://hub:8100;
        proxy_pass $hub;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 502 503 504 404 = @servers_static;  # no hub running: serve the static list
    }
    location @servers_static {
        root /usr/share/nginx/html;
        try_files /servers.json =404;
        default_type application/json;
    }
}
