server {
    listen 80;
    root /usr/share/nginx/html;

    location / { try_files $uri /index.html; }

    location /api/ {
        resolver 127.0.0.11 valid=5s;  # Docker DNS: re-resolve so rebuilding api doesn't leave a stale IP
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
}
