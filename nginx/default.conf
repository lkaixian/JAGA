# Requests arriving through the Cloudflare tunnel carry Cf-Connecting-Ip. Public visitors may read, never write.
map $http_cf_connecting_ip$request_method $tunnel_write {
    default 0;
    "~^.+(POST|PUT|PATCH|DELETE)$" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location / { try_files $uri /index.html; }

    location /api/ {
        if ($tunnel_write) { return 403; }
        resolver 127.0.0.11 valid=5s;  # Docker DNS: re-resolve so rebuilding api doesn't leave a stale IP
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
}
