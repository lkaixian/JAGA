# Builds the iPhone app on a GitHub-hosted Mac, on every push / PR into master and by hand.
# The result is an UNSIGNED .ipa (artifact "jaga-ios-unsigned"). It must be signed before it installs on a real
# iPhone: see "iPhone" in the README. The build compiles; it does not prove the app runs on a device.
name: iOS build (unsigned)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build ios --release --no-codesign
        working-directory: app
      - name: Package the .app as an .ipa
        working-directory: app
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr jaga-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: jaga-ios-unsigned
          path: app/jaga-unsigned.ipa
