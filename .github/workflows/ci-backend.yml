name: Backend
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch stops the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # server/trend.py uses statistics.linear_regression - needs Python 3.12+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            hub/requirements.txt
      # httpx is not in requirements.txt (production images never call
      # TestClient), but the tests all do.
      - run: python -m pip install -r server/requirements.txt -r hub/requirements.txt httpx
      - name: Trend self-check
        run: python server/trend.py
      - name: Server tests
        run: |
          python server/test_ingest.py
          python server/test_ntfy.py
          python server/test_poll.py
          python server/test_push.py
      - name: Hub tests
        run: python hub/test_hub.py
