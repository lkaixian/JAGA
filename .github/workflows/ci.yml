# CI for every push / PR into master. Three independent jobs - a failure in one
# does not hide the others. The iOS build stays manual (see ios.yml).
#
# What is proven here: the backend tests pass, the app analyzes and tests clean,
# and both firmware projects COMPILE with the placeholder node_config.h. A green
# firmware job is not proof the node is configured right for your site - only
# that the code builds for esp32 on ESP-IDF v4.3.6, the version this repo is
# pinned to.
name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch stops the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # server/trend.py uses statistics.linear_regression - needs Python 3.12+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            hub/requirements.txt
      # httpx is not in requirements.txt (production images never call
      # TestClient), but the tests all do.
      - run: python -m pip install -r server/requirements.txt -r hub/requirements.txt httpx
      - name: Trend self-check
        run: python server/trend.py
      - name: Server tests
        run: |
          python server/test_ingest.py
          python server/test_ntfy.py
          python server/test_poll.py
          python server/test_push.py
      - name: Hub tests
        run: python hub/test_hub.py

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1" # same pin as ios.yml
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ["."] # "." = the slave (root CMakeLists), "master" = the master
    steps:
      # Not `container:` - the IDF v4.3.6 image has glibc 2.27, too old for the
      # node that runs JS actions (checkout, cache). The job runs on the host
      # and only the build runs inside the image.
      - uses: actions/checkout@v4
      # master/main/node_config.h is gitignored (site config: WiFi, tokens);
      # CI proves the build against the committed placeholder instead.
      - name: Use the placeholder node config
        if: matrix.project == 'master'
        run: cp master/main/node_config.h.example master/main/node_config.h
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: idf-ccache-${{ matrix.project }}-${{ github.run_id }}
          restore-keys: idf-ccache-${{ matrix.project }}-
      - name: Build
        run: |
          mkdir -p ~/.cache/ccache
          docker run --rm -v "$PWD:/w" -v "$HOME/.cache/ccache:/root/.cache/ccache"             -w "/w/${{ matrix.project }}" espressif/idf:v4.3.6 bash -c '
              git config --global --add safe.directory /w
              . "$IDF_PATH/export.sh"
              idf.py set-target esp32
              idf.py build'

  # The pure C pieces (wire format, level maths, BCD) compile under host gcc -
  # no ESP-IDF, seconds to run. common/ headers are the firmware's own.
  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run each test/host/*.c
        run: |
          set -e
          for t in test/host/*.c; do
            echo "::group::$t"
            gcc -Wall -Wextra -Werror -std=gnu11 -Icommon "$t" -o /tmp/host_test -lm
            /tmp/host_test
            echo "::endgroup::"
          done
